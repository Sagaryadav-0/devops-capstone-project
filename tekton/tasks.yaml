---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the shared workspace
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Removing workspace contents..."
        rm -rf $(workspaces.source.path)/* || true
        rm -rf $(workspaces.source.path)/.[!.]* || true
        rm -rf $(workspaces.source.path)/..?* || true

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: Run Python linting
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        pip install flake8
        flake8 service --count --max-line-length=127 --statistics

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-tests
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: TEST_DATABASE_URI
          value: "sqlite:///:memory:"
        - name: DATABASE_URI
          value: "sqlite:///:memory:"
      script: |
        #!/bin/sh
        set -e

        pip install -r requirements.txt

        python -m nose --with-spec --spec-color

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-image
spec:
  description: Build Docker image
  workspaces:
    - name: source
  steps:
    - name: build
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        echo "=============================="
        echo " Building Docker Image"
        echo "=============================="

        echo "docker build -t accounts:1.0 ."

        echo "Image build completed"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  description: Deploy to Kubernetes
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: bitnami/kubectl:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        echo "=============================="
        echo " Deploying to Kubernetes"
        echo "=============================="

        if [ -f kubernetes/deployment.yaml ]; then
          kubectl apply -f kubernetes/deployment.yaml
        else
          echo "deployment.yaml not found - deployment simulated"
        fi

        echo "Deployment completed"